<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sakura Tree | Escbase</title>
<meta name="description" content="A peaceful sakura tree growing from sapling to full bloom in a mountain landscape.">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f0e17;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  body{position:fixed;inset:0;touch-action:none}
  canvas{display:block;width:100vw;height:100dvh}
  .hud{
    position:fixed;
    left:max(16px,env(safe-area-inset-left));
    right:max(16px,env(safe-area-inset-right));
    top:max(16px,env(safe-area-inset-top));
    z-index:2;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    pointer-events:none
  }
  .brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}
  .label{text-align:right;font-size:11px;line-height:1.35;color:rgba(255,255,255,.52)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="brand">ESCBASE / TEST2</div>
  <div class="label">Sakura tree<br>sapling → full bloom</div>
</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  // === RESIZE HANDLER ===
  // Handle high-DPI displays and viewport changes gracefully
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  // === ANIMATION STATE ===
  // 'grow' phase: tree grows from sapling to full size
  // 'bloom' phase: flowers appear after tree is full
  const startTime = performance.now();
  const GROW_DURATION = 6000; // tree grows over 6 seconds
  const BLOOM_DELAY = 1000;   // delay after grow before blooming

  // === PETAL SYSTEM ===
  // Each petal drifts down with rotation and horizontal wind sway
  const petals = [];
  const PETAL_COUNT = 60;
  for (let i = 0; i < PETAL_COUNT; i++) {
    petals.push({
      x: Math.random() * W,
      y: Math.random() * -H, // start above screen
      size: 2 + Math.random() * 3,
      speed: 0.5 + Math.random() * 1.2,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.02,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: 0.02 + Math.random() * 0.04,
      opacity: 0.6 + Math.random() * 0.4
    });
  }

  function updatePetals() {
    const wind = Math.sin(performance.now() * 0.001) * 0.5;
    for (const p of petals) {
      p.y += p.speed;
      p.sway += p.swaySpeed;
      p.x += Math.sin(p.sway) * 0.5 + wind;
      p.rotation += p.rotSpeed;
      // Reset petal when it falls below screen
      if (p.y > H + 10) {
        p.y = -10 - Math.random() * 50;
        p.x = Math.random() * W;
      }
      // Wrap horizontally
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
    }
  }

  function drawPetal(p) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation);
    ctx.globalAlpha = p.opacity;
    // Draw a simple 5-petal flower shape
    ctx.fillStyle = '#ffb7c5';
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI * 2;
      const px = Math.cos(angle) * p.size;
      const py = Math.sin(angle) * p.size * 0.6;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
      // Petal tip
      const tipAngle = angle;
      const tx = Math.cos(tipAngle) * p.size * 1.6;
      const ty = Math.sin(tipAngle) * p.size * 1.0;
      ctx.quadraticCurveTo(tx, ty, Math.cos((i + 1) / 5 * Math.PI * 2) * p.size, Math.sin((i + 1) / 5 * Math.PI * 2) * p.size * 0.6);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // === MOUNTAIN LAYERS ===
  // Multiple layers of mountains for depth (parallax effect via color/distance)
  const mountains = [
    // Far mountains
    { color: '#2d1b4e', yOffset: 0.45, peaks: 5, amplitude: 40, seed: 1 },
    // Mid mountains  
    { color: '#1a1a2e', yOffset: 0.52, peaks: 7, amplitude: 55, seed: 2 },
    // Near mountains
    { color: '#0f0e17', yOffset: 0.58, peaks: 9, amplitude: 45, seed: 3 }
  ];

  function drawMountains() {
    for (const m of mountains) {
      const baseY = H * m.yOffset;
      ctx.fillStyle = m.color;
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, baseY);
      const step = W / m.peaks;
      for (let i = 0; i <= m.peaks; i++) {
        const x = i * step;
        // Pseudo-random mountain height using seed
        const h = m.amplitude * (0.4 + Math.sin(i * 1.7 + m.seed) * 0.3 + Math.cos(i * 2.3 + m.seed) * 0.3);
        ctx.lineTo(x, baseY - h);
      }
      ctx.lineTo(W, baseY);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();
    }
  }

  // === SKY GRADIENT ===
  // Soft dawn/dusk sky with gentle pink and blue tones
  function drawSky() {
    const grd = ctx.createLinearGradient(0, 0, 0, H * 0.7);
    grd.addColorStop(0, '#1a0a2e');    // deep purple at top
    grd.addColorStop(0.3, '#2d1b4e');  // purple
    grd.addColorStop(0.5, '#4a306d');  // lighter purple
    grd.addColorStop(0.7, '#6b4c7a');  // mauve
    grd.addColorStop(1, '#8b6f8a');    // soft pinkish at horizon
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }

  // === GRASS / GROUND ===
  function drawGround() {
    const groundY = H * 0.65;
    const grd = ctx.createLinearGradient(0, groundY, 0, H);
    grd.addColorStop(0, '#1a3a1a');
    grd.addColorStop(0.5, '#0d260d');
    grd.addColorStop(1, '#051405');
    ctx.fillStyle = grd;
    ctx.fillRect(0, groundY, W, H - groundY);
  }

  // === TREE GROWTH ANIMATION ===
  // Recursive fractal tree that grows from sapling to full bloom
  // Uses a time-based growth factor (0..1) to animate branch length

  // Pre-compute tree structure (branch angles and relative lengths)
  // so the tree shape stays consistent while only scale changes
  function buildTree() {
    const branches = [];
    function addBranch(x, y, angle, depth, parentLen) {
      if (depth <= 0) return;
      const len = parentLen * (0.65 + Math.random() * 0.15);
      const endX = x + Math.cos(angle) * len;
      const endY = y + Math.sin(angle) * len;
      branches.push({ x, y, endX, endY, len, angle, depth });
      const numSub = depth > 2 ? 2 : (depth > 1 ? 2 : 0);
      for (let i = 0; i < numSub; i++) {
        const spread = 0.6 + Math.random() * 0.4;
        const dir = i === 0 ? -1 : 1;
        const newAngle = angle + dir * spread * (0.5 + Math.random() * 0.3);
        addBranch(endX, endY, newAngle, depth - 1, len);
      }
    }
    // Seed random with fixed seed for reproducible tree shape
    let seed = 42;
    const origRandom = Math.random;
    Math.random = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
    addBranch(0, 0, -Math.PI / 2, 10, 90);
    Math.random = origRandom;
    return branches;
  }

  const treeBranches = buildTree();

  function drawTree(growth) {
    const trunkX = W * 0.5;
    const trunkY = H * 0.65;
    const maxTrunkLen = Math.min(W, H) * 0.22;
    const currentScale = growth * maxTrunkLen / 90; // normalize to canvas size

    // Gentle wind sway based on time
    const time = performance.now() * 0.001;
    const windSway = Math.sin(time) * 0.015;

    ctx.save();
    ctx.translate(trunkX, trunkY);

    for (const b of treeBranches) {
      // Only draw branches that have "grown" based on depth
      const branchProgress = Math.max(0, Math.min(1, (growth * 10 - (10 - b.depth)) / 1.5));
      if (branchProgress <= 0) continue;

      const sway = windSway * (11 - b.depth); // more sway at tips
      const sx = b.x * currentScale;
      const sy = b.y * currentScale;
      const ex = (b.endX * Math.cos(sway) - b.endY * Math.sin(sway)) * currentScale * branchProgress;
      const ey = (b.endX * Math.sin(sway) + b.endY * Math.cos(sway)) * currentScale * branchProgress;

      // Branch thickness based on depth
      const thickness = Math.max(0.5, (b.depth / 10) * 6 * growth);
      ctx.lineWidth = thickness;
      ctx.lineCap = 'round';

      // Branch color: darker at base, lighter at tips
      const brown = Math.floor(60 + (10 - b.depth) * 8);
      ctx.strokeStyle = `rgb(${brown + 20}, ${brown}, ${brown - 10})`;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.stroke();

      // Draw flowers/blooms on terminal branches when tree is mature
      if (b.depth <= 3 && growth > 0.75) {
        const bloomProgress = (growth - 0.75) / 0.25;
        const flowerCount = Math.floor(bloomProgress * 5);
        for (let f = 0; f < flowerCount; f++) {
          const t = (f + 1) / (flowerCount + 1);
          const fx = sx + (ex - sx) * t;
          const fy = sy + (ey - sy) * t;
          drawFlower(fx, fy, (10 - b.depth) * 0.8 * bloomProgress);
        }
      }
    }
    ctx.restore();
  }

  function drawFlower(x, y, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = 0.85;
    // Soft pink sakura petals
    ctx.fillStyle = '#ffb7c5';
    for (let i = 0; i < 5; i++) {
      ctx.save();
      ctx.rotate((i / 5) * Math.PI * 2);
      ctx.beginPath();
      ctx.ellipse(0, -size, size * 0.5, size, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    // Center
    ctx.fillStyle = '#ffe4e1';
    ctx.beginPath();
    ctx.arc(0, 0, size * 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // === MAIN RENDER LOOP ===
  function loop() {
    const now = performance.now();
    const elapsed = now - startTime;

    // Growth phase: 0 -> 1 over GROW_DURATION ms
    let growth = Math.min(1, elapsed / GROW_DURATION);
    // Ease out for natural growth feel
    growth = 1 - Math.pow(1 - growth, 3);

    // Bloom phase starts after tree is mostly grown
    const bloomPhase = Math.max(0, Math.min(1, (elapsed - GROW_DURATION - BLOOM_DELAY) / 3000));

    // Clear and draw layers
    drawSky();
    drawMountains();
    drawGround();
    drawTree(growth);
    updatePetals();
    for (const p of petals) drawPetal(p);

    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
