  <text x="72" y="356" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">Tăng trưởng không chỉ là con số đẹp — nó là tín hiệu AI coding</text>
  <text x="72" y="396" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="500">đang rời khỏi sân demo để thành công cụ lao động thật.</text>

  <rect x="72" y="454" width="270" height="104" rx="24" fill="#0F172A" stroke="#334155"/>
