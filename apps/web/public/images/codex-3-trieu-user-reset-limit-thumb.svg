<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="36" fill="#0B1020"/>
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="url(#bg)" stroke="rgba(255,255,255,0.12)"/>
  <circle cx="958" cy="126" r="180" fill="#2563EB" fill-opacity="0.18"/>
  <circle cx="1030" cy="506" r="220" fill="#7C3AED" fill-opacity="0.16"/>
  <circle cx="180" cy="120" r="110" fill="#22C55E" fill-opacity="0.14"/>
  <rect x="72" y="86" width="188" height="42" rx="21" fill="#172554" stroke="#3B82F6"/>
  <text x="166" y="113" text-anchor="middle" fill="#93C5FD" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">AI Coding</text>
  <text x="72" y="210" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="800">Codex cán mốc 3 triệu user/tuần</text>
