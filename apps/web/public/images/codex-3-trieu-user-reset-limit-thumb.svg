  <text x="102" y="540" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="800">3M users</text>

  <rect x="370" y="454" width="320" height="104" rx="24" fill="#0F172A" stroke="#334155"/>
  <text x="400" y="500" fill="#A78BFA" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Động thái</text>
  <text x="400" y="540" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">Reset usage limits</text>

  <rect x="718" y="454" width="410" height="104" rx="24" fill="#0F172A" stroke="#334155"/>
  <text x="748" y="500" fill="#4ADE80" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Ý nghĩa</text>
  <text x="748" y="540" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="800">AI dev tool vào pha phổ cập</text>

  <defs>
    <linearGradient id="bg" x1="70" y1="40" x2="1090" y2="590" gradientUnits="userSpaceOnUse">
