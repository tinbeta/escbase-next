<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="60" x2="800" y2="60" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="#8b5cf6" stroke-width="0.5"/>
  </g>
  <!-- Glow effect -->
  <ellipse cx="400" cy="180" rx="300" ry="120" fill="url(#glow)"/>
  <!-- Robot/Agent icon -->
  <g transform="translate(600,50)" opacity="0.12">
    <rect x="10" y="10" width="60" height="50" rx="10" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="30" cy="32" r="5" fill="#8b5cf6"/>
    <circle cx="50" cy="32" r="5" fill="#8b5cf6"/>
    <rect x="25" y="45" width="30" height="3" rx="1.5" fill="#8b5cf6"/>
    <line x1="20" y1="0" x2="20" y2="10" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="60" y1="0" x2="60" y2="10" stroke="#8b5cf6" stroke-width="2"/>
    <circle cx="20" cy="0" r="3" fill="#8b5cf6"/>
    <circle cx="60" cy="0" r="3" fill="#8b5cf6"/>
  </g>
  <!-- Terminal icon -->
  <g transform="translate(80,280)" opacity="0.1">
    <rect x="0" y="0" width="80" height="55" rx="5" fill="none" stroke="#6366f1" stroke-width="2"/>
    <polyline points="10,20 25,30 10,40" fill="none" stroke="#6366f1" stroke-width="2"/>
    <line x1="30" y1="40" x2="55" y2="40" stroke="#6366f1" stroke-width="2"/>
  </g>
  <!-- Code brackets -->
  <g transform="translate(650,280)" opacity="0.1">
    <text font-family="monospace" font-size="50" fill="#8b5cf6">{}</text>
  </g>
  <!-- Accent bar -->
  <rect x="60" y="110" width="4" height="80" rx="2" fill="url(#accent)"/>
  <!-- Title -->
  <text x="80" y="145" font-family="Inter,system-ui,sans-serif" font-size="32" font-weight="800" fill="#f8fafc">
    Devin AI Là Gì?
  </text>
  <text x="80" y="182" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    AI Software Engineer by Cognition AI
  </text>
  <!-- Feature pills -->
  <rect x="80" y="210" width="90" height="28" rx="14" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" stroke-width="1"/>
  <text x="125" y="229" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#818cf8" text-anchor="middle">Use Cases</text>
  <rect x="185" y="210" width="80" height="28" rx="14" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="225" y="229" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#a78bfa" text-anchor="middle">Pricing</text>
  <rect x="280" y="210" width="100" height="28" rx="14" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.3)" stroke-width="1"/>
  <text x="330" y="229" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Best Practices</text>
  <rect x="395" y="210" width="120" height="28" rx="14" fill="rgba(192,132,252,0.15)" stroke="rgba(192,132,252,0.3)" stroke-width="1"/>
  <text x="455" y="229" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#d8b4fe" text-anchor="middle">Cho Người Mới</text>
  <!-- Key features -->
  <g transform="translate(80,275)">
    <circle cx="6" cy="6" r="4" fill="#6366f1"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Tự viết code, test, tạo PR</text>
  </g>
  <g transform="translate(80,300)">
    <circle cx="6" cy="6" r="4" fill="#8b5cf6"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">VM riêng + browser + shell</text>
  </g>
  <g transform="translate(80,325)">
    <circle cx="6" cy="6" r="4" fill="#a78bfa"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Slack / Teams / Web integration</text>
  </g>
  <g transform="translate(350,275)">
    <circle cx="6" cy="6" r="4" fill="#6366f1"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Chạy nhiều tasks song song</text>
  </g>
  <g transform="translate(350,300)">
    <circle cx="6" cy="6" r="4" fill="#8b5cf6"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">MCP: Datadog, Sentry, Figma...</text>
  </g>
  <g transform="translate(350,325)">
    <circle cx="6" cy="6" r="4" fill="#a78bfa"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Free → Pro $20 → Max $200</text>
  </g>
  <!-- Footer -->
  <text x="80" y="390" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">escbase.xyz</text>
  <text x="720" y="390" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="end">AI Tools</text>
</svg>
