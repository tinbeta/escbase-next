  <rect x="190" y="125" width="80" height="6" rx="3" fill="#475569"/>
  <rect x="190" y="138" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="190" y="148" width="100" height="4" rx="2" fill="#334155"/>
  <rect x="190" y="158" width="70" height="4" rx="2" fill="#334155"/>
  <rect x="190" y="175" width="50" height="16" rx="4" fill="#6366f1" opacity="0.3"/>
  <text x="250" y="187" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">Workspace A</text>

  <rect x="330" y="110" width="140" height="90" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="340" y="125" width="80" height="6" rx="3" fill="#475569"/>
  <rect x="340" y="138" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="340" y="148" width="100" height="4" rx="2" fill="#334155"/>
  <rect x="340" y="158" width="70" height="4" rx="2" fill="#334155"/>
  <rect x="340" y="175" width="50" height="16" rx="4" fill="#22c55e" opacity="0.3"/>
  <text x="400" y="187" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#22c55e" text-anchor="middle">Workspace B</text>

  <rect x="480" y="110" width="140" height="90" rx="10" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <rect x="490" y="125" width="80" height="6" rx="3" fill="#475569"/>
  <rect x="490" y="138" width="60" height="4" rx="2" fill="#334155"/>
  <rect x="490" y="148" width="100" height="4" rx="2" fill="#334155"/>
  <rect x="490" y="158" width="70" height="4" rx="2" fill="#334155"/>
  <rect x="490" y="175" width="50" height="16" rx="4" fill="#f59e0b" opacity="0.3"/>
  <text x="550" y="187" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#f59e0b" text-anchor="middle">Workspace C</text>

  <!-- Coordinator agent -->
  <circle cx="400" cy="250" r="28" fill="#0b1220" stroke="#6366f1" stroke-width="2"/>
  <text x="400" y="257" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#6366f1" text-anchor="middle">🐧</text>

  <!-- Connecting lines -->
  <line x1="250" y1="200" x2="380" y2="232" stroke="#6366f1" stroke-width="1.5" opacity="0.5"/>
  <line x1="400" y1="200" x2="400" y2="222" stroke="#22c55e" stroke-width="1.5" opacity="0.5"/>
  <line x1="550" y1="200" x2="420" y2="232" stroke="#f59e0b" stroke-width="1.5" opacity="0.5"/>

  <!-- Sub agents -->
  <circle cx="340" cy="290" r="14" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <text x="340" y="295" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">1</text>

  <circle cx="400" cy="305" r="14" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <text x="400" y="310" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">2</text>

  <circle cx="460" cy="290" r="14" fill="#0b1220" stroke="#22c55e" stroke-width="1.5"/>
  <text x="460" y="295" font-family="Inter, -apple-system, sans-serif" font-size="10" fill="#22c55e" text-anchor="middle">3</text>

  <line x1="400" y1="278" x2="340" y2="276" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="278" x2="400" y2="291" stroke="#22c55e" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="278" x2="460" y2="276" stroke="#22c55e" stroke-width="1" opacity="0.4"/>

  <!-- Title -->
  <text x="400" y="360" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">holaOS Beta 0.1</text>
  <text x="400" y="390" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle">AI Teammates Cho Công Việc Kéo Dài Theo Thờì Gian</text>

  <!-- OS dot -->
  <circle cx="400" cy="55" r="20" fill="#6366f1"/>
  <text x="400" y="61" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">OS</text>
