<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7931a"/>
      <stop offset="100%" style="stop-color:#ef4444"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="40" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Grid pattern (subtle) -->
  <g opacity="0.04">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="420" fill="url(#grid)"/>
  </g>
  <!-- Glow effect behind badge -->
  <ellipse cx="650" cy="100" rx="200" ry="90" fill="#ef4444" opacity="0.15" filter="url(#glow)"/>
  <!-- Accent bar -->
  <rect x="50" y="70" width="4" height="100" rx="2" fill="url(#accent)"/>
  <!-- Title text -->
  <text x="70" y="115" font-family="Inter,system-ui,sans-serif" font-size="38" font-weight="800" fill="#f8fafc">
    Stripe Link Wallet for Agents
  </text>
  <!-- Subtitle -->
  <text x="70" y="160" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="500" fill="#94a3b8" max-width="660">
    Empower AI agents to spend securely — without exposing credentials
  </text>
  <!-- Stripe/Agents badge -->
  <rect x="70" y="190" width="140" height="36" rx="18" fill="#635bff" opacity="0.9"/>
  <text x="90" y="218" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#ffffff">Stripe Link</text>
  <!-- Escbase branding -->
  <text x="70" y="380" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#64748b">escbase.xyz</text>
</svg>