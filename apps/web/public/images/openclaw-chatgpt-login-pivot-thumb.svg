<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <!-- Background gradient: dark cyberpunk-ish -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
    <!-- Accent gradient: Orange-red (from OpenClaw brand color) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#ea580c"/>
    </linearGradient>
    <!-- Glow effect -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <!-- Vertical lines -->
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
  </g>

  <!-- Glow ellipse behind title -->
  <ellipse cx="400" cy="120" rx="300" ry="60" fill="url(#glow)"/>

  <!-- Accent bar (left) -->
  <rect x="40" y="70" width="4" height="100" rx="2" fill="url(#accent)"/>

  <!-- Title text -->
  <text x="60" y="115" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="800" fill="#f8fafc">
    OpenClaw Pivot
  </text>

  <!-- Subtitle -->
  <text x="60" y="155" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
    ChatGPT Plus login thay thế Claude API sau khi bị Anthropic cấm
  </text>

  <!-- Two-column comparison visualization (symbolic) -->
  <g transform="translate(60, 200)">
    <!-- OpenAI side (left) -->
    <rect x="0" y="0" width="180" height="120" rx="16" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.3)" stroke-width="2"/>
    <text x="90" y="45" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#22c55e" text-anchor="middle">OPENAI</text>
    <text x="90" y="75" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">ChatGPT Plus login</text>
    <text x="90" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Near-unlimited</text>
    <text x="90" y="115" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">No API key needed</text>

    <!-- VS divider -->
    <text x="210" y="75" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" fill="#52525b" text-anchor="middle">VS</text>

    <!-- Anthropic side (right) -->
    <rect x="240" y="0" width="180" height="120" rx="16" fill="rgba(239,68,68,0.12)" stroke="rgba(239,68,68,0.3)" stroke-width="2"/>
    <text x="330" y="45" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#ef4444" text-anchor="middle">ANTHROPIC</text>
    <text x="330" y="75" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Banned external tools</text>
    <text x="330" y="95" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Pay-per-use API</text>
    <text x="330" y="115" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#a1a1aa" text-anchor="middle">Lock-down policy</text>
  </g>

  <!-- Feature badges (bottom row) -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#18181b" stroke="var(--border)" stroke-width="1" opacity="0.8"/>
    <text x="70" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa" text-anchor="middle">🤖 AI Agent</text>

    <rect x="160" y="0" width="140" height="28" rx="14" fill="#18181b" stroke="var(--border)" stroke-width="1" opacity="0.8"/>
    <text x="230" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa" text-anchor="middle">🔓 Open Source</text>

    <rect x="320" y="0" width="140" height="28" rx="14" fill="#18181b" stroke="var(--border)" stroke-width="1" opacity="0.8"/>
    <text x="390" y="18" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fafafa" text-anchor="middle">🚀 GPT-5 Ready</text>
  </g>

  <!-- Escbase branding -->
  <text x="760" y="405" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#52525b" text-anchor="end">escbase.xyz</text>
</svg>