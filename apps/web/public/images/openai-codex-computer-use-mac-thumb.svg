<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10a37f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#glow)"/>

  <!-- Grid pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="60" x2="800" y2="60"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="100" y1="0" x2="100" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="300" y1="0" x2="300" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="500" y1="0" x2="500" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
    <line x1="700" y1="0" x2="700" y2="420"/>
  </g>

  <!-- Mac window -->
  <rect x="220" y="100" width="360" height="220" rx="12" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>
  <rect x="220" y="100" width="360" height="28" rx="12" fill="#1e293b"/>
  <rect x="220" y="116" width="360" height="12" fill="#1e293b"/>
  <circle cx="240" cy="114" r="4" fill="#ef4444"/>
  <circle cx="256" cy="114" r="4" fill="#f59e0b"/>
  <circle cx="272" cy="114" r="4" fill="#22c55e"/>

  <!-- Code lines inside window -->
  <rect x="240" y="140" width="120" height="8" rx="4" fill="#334155"/>
  <rect x="240" y="156" width="200" height="8" rx="4" fill="#475569"/>
  <rect x="240" y="172" width="160" height="8" rx="4" fill="#334155"/>
  <rect x="240" y="188" width="280" height="8" rx="4" fill="#10a37f" opacity="0.6"/>
  <rect x="240" y="204" width="100" height="8" rx="4" fill="#334155"/>
  <rect x="240" y="220" width="180" height="8" rx="4" fill="#475569"/>
  <rect x="240" y="236" width="240" height="8" rx="4" fill="#10a37f" opacity="0.4"/>

  <!-- AI Cursor -->
  <g transform="translate(520, 260)">
    <polygon points="0,0 16,28 6,28 10,40 0,32 -6,40 -2,28 -12,28" fill="#10a37f"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#10a37f" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="18;24;18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Small agent icons in background -->
  <g opacity="0.15">
    <rect x="80" y="180" width="80" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="100" y="200" width="40" height="4" rx="2" fill="#475569"/>
    <rect x="100" y="210" width="30" height="4" rx="2" fill="#475569"/>
    <rect x="100" y="220" width="50" height="4" rx="2" fill="#475569"/>
  </g>
  <g opacity="0.15">
    <rect x="640" y="150" width="80" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="660" y="170" width="40" height="4" rx="2" fill="#475569"/>
    <rect x="660" y="180" width="30" height="4" rx="2" fill="#475569"/>
    <rect x="660" y="190" width="50" height="4" rx="2" fill="#475569"/>
  </g>

  <!-- Title -->
  <text x="400" y="340" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#f8fafc" text-anchor="middle">OpenAI Codex Computer Use</text>
  <text x="400" y="375" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="middle">AI Agent Chạy Ngầm Trên Mac — Không Chiếm Màn Hình</text>

  <!-- OpenAI dot -->
  <circle cx="400" cy="55" r="22" fill="#10a37f"/>
  <text x="400" y="62" font-family="Inter, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">AI</text>
</svg>
