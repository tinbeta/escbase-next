  <g transform="translate(80,230)">
    <rect x="0" y="0" width="130" height="55" rx="8" fill="rgba(239,68,68,.08)" stroke="rgba(239,68,68,.15)" stroke-width="1"/>
    <text x="65" y="25" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#f87171" text-anchor="middle">80+</text>
    <text x="65" y="42" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Changes</text>
  </g>
  <g transform="translate(225,230)">
    <rect x="0" y="0" width="130" height="55" rx="8" fill="rgba(249,115,22,.08)" stroke="rgba(249,115,22,.15)" stroke-width="1"/>
    <text x="65" y="25" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#fb923c" text-anchor="middle">40+</text>
    <text x="65" y="42" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Bug Fixes</text>
  </g>
  <g transform="translate(370,230)">
    <rect x="0" y="0" width="130" height="55" rx="8" fill="rgba(168,85,247,.08)" stroke="rgba(168,85,247,.15)" stroke-width="1"/>
    <text x="65" y="25" font-family="Inter,system-ui,sans-serif" font-size="18" font-weight="800" fill="#c084fc" text-anchor="middle">364K</text>
    <text x="65" y="42" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">GitHub Stars</text>
