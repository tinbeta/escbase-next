<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a"/>
      <stop offset="100%" style="stop-color:#1a0f2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.05">
    <line x1="0" y1="60" x2="800" y2="60" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="800" y2="120" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="800" y2="180" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="800" y2="240" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="800" y2="360" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#ef4444" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="420" stroke="#ef4444" stroke-width="0.5"/>
  </g>
  <!-- Glow -->
  <ellipse cx="400" cy="160" rx="280" ry="110" fill="url(#glow)"/>
  <!-- Lobster icon (simplified) -->
  <g transform="translate(620,40)" opacity="0.15">
