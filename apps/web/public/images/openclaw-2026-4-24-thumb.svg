  <g transform="translate(80,310)">
    <circle cx="6" cy="6" r="4" fill="#ef4444"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Voice calls reach full agent + tools</text>
  </g>
  <g transform="translate(80,333)">
    <circle cx="6" cy="6" r="4" fill="#f97316"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">DeepSeek V4 Flash = new default model</text>
  </g>
  <g transform="translate(80,356)">
    <circle cx="6" cy="6" r="4" fill="#eab308"/>
