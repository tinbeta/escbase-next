  <!-- Title -->
  <text x="80" y="120" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="800" fill="#f8fafc">
    OpenClaw 2026.4.24
  </text>
  <text x="80" y="155" font-family="Inter,system-ui,sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Bản cập nhật lớn nhất từ trước đến nay
  </text>
  <!-- Feature pills -->
  <rect x="80" y="180" width="100" height="26" rx="13" fill="rgba(239,68,68,.15)" stroke="rgba(239,68,68,.3)" stroke-width="1"/>
  <text x="130" y="197" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#f87171" text-anchor="middle">Voice Calls</text>
  <rect x="195" y="180" width="110" height="26" rx="13" fill="rgba(249,115,22,.15)" stroke="rgba(249,115,22,.3)" stroke-width="1"/>
  <text x="250" y="197" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#fb923c" text-anchor="middle">DeepSeek V4</text>
  <rect x="320" y="180" width="130" height="26" rx="13" fill="rgba(234,179,8,.15)" stroke="rgba(234,179,8,.3)" stroke-width="1"/>
  <text x="385" y="197" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#facc15" text-anchor="middle">Browser Clicks</text>
  <rect x="465" y="180" width="120" height="26" rx="13" fill="rgba(168,85,247,.15)" stroke="rgba(168,85,247,.3)" stroke-width="1"/>
  <text x="525" y="197" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="#c084fc" text-anchor="middle">Google Meet</text>
