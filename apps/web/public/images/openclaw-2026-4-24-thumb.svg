  </g>
  <g transform="translate(420,310)">
    <circle cx="6" cy="6" r="4" fill="#a855f7"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Google Meet bundled plugin</text>
  </g>
  <g transform="translate(420,333)">
    <circle cx="6" cy="6" r="4" fill="#ef4444"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Gemini Live voice provider</text>
  </g>
  <g transform="translate(420,356)">
    <circle cx="6" cy="6" r="4" fill="#f97316"/>
    <text x="16" y="10" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#94a3b8">Static model catalogs, faster startup</text>
  </g>
  <!-- Footer -->
  <text x="80" y="400" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569">escbase.xyz</text>
  <text x="720" y="400" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#475569" text-anchor="end">AI Agent</text>
