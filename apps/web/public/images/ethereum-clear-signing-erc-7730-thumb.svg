<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#627eea"/>
      <stop offset="100%" style="stop-color:#22c55e"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#627eea;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#22c55e;stop-opacity:0.08"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.04">
    <path d="M0 60h800M0 120h800M0 180h800M0 240h800M0 300h800M0 360h800" stroke="#fff" stroke-width="1"/>
    <path d="M80 0v420M160 0v420M240 0v420M320 0v420M400 0v420M480 0v420M560 0v420M640 0v420M720 0v420" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Glow orb -->
  <circle cx="680" cy="140" r="140" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Shield / Lock icon -->
  <g transform="translate(620, 80)">
    <path d="M60 10 L110 30 L110 75 Q110 110 60 130 Q10 110 10 75 L10 30 Z" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.9"/>
    <path d="M60 25 L95 40 L95 72 Q95 98 60 113 Q25 98 25 72 L25 40 Z" fill="url(#accent)" opacity="0.12"/>
    <text x="60" y="85" font-family="Inter,system-ui,sans-serif" font-size="32" font-weight="700" fill="url(#accent)" text-anchor="middle">✓</text>
  </g>

  <!-- Accent bar -->
  <rect x="60" y="90" width="4" height="80" rx="2" fill="url(#accent)"/>

  <!-- Title -->
  <text x="80" y="125" font-family="Inter,system-ui,sans-serif" font-size="32" font-weight="800" fill="#f8fafc">
    Clear Signing Chính Thức Ra Mắt
  </text>

  <!-- Subtitle -->
  <text x="80" y="162" font-family="Inter,system-ui,sans-serif" font-size="17" font-weight="500" fill="#94a3b8">
    ERC-7730 — Kết thúc blind signing, giao dịch human-readable
  </text>

  <!-- Feature pills -->
  <g transform="translate(80, 200)">
    <rect x="0" y="0" width="110" height="32" rx="16" fill="rgba(98,126,234,0.12)" stroke="rgba(98,126,234,0.25)" stroke-width="1"/>
    <text x="55" y="22" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#627eea" text-anchor="middle">ERC-7730</text>

    <rect x="124" y="0" width="130" height="32" rx="16" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
    <text x="189" y="22" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#22c55e" text-anchor="middle">Human-Readable</text>

    <rect x="268" y="0" width="140" height="32" rx="16" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
    <text x="338" y="22" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="600" fill="#f59e0b" text-anchor="middle">Open Standard</text>
  </g>

  <!-- Contributors mini list -->
  <text x="80" y="280" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500" fill="#64748b">
    Ledger · Trezor · MetaMask · WalletConnect · Cyfrin · Fireblocks · Ethereum Foundation
  </text>

  <!-- Branding -->
  <text x="80" y="390" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="700" fill="#475569">
    news.escbase.xyz
  </text>
  <text x="720" y="390" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="end">
    May 12, 2026
  </text>
</svg>
