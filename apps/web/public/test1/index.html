<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lorenz Attractor | ESC Base</title><meta name="description" content="Full-screen Lorenz attractor visualization optimized for mobile."><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020617;color:#fff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{position:fixed;inset:0;touch-action:none}canvas{display:block;width:100vw;height:100dvh;background:radial-gradient(circle at 50% 42%,#111827 0,#030712 44%,#000 100%)}.hud{position:fixed;left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));top:max(16px,env(safe-area-inset-top));z-index:2;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}.brand{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.72)}.label{text-align:right;font-size:11px;line-height:1.35;color:rgba(255,255,255,.52)}.glow{position:fixed;inset:auto 0 0 0;height:38vh;background:linear-gradient(0deg,rgba(34,211,238,.14),transparent);pointer-events:none}</style></head><body><canvas id="c"></canvas><div class="hud"><div class="brand">ESCBASE / TEST1</div><div class="label">Lorenz attractor<br>σ=10 · ρ=28 · β=8/3</div></div><div class="glow"></div><script>(()=>{const c=document.getElementById('c'),ctx=c.getContext('2d',{alpha:false});let w=0,h=0,dpr=1,pts=[],x=.1,y=0,z=0,t=0;const sigma=10,rho=28,beta=8/3,dt=.006,max=3000;function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize,{passive:true});resize();function step(){for(let i=0;i<5;i++){const dx=sigma*(y-x),dy=x*(rho-z)-y,dz=x*y-beta*z;x+=dx*dt;y+=dy*dt;z+=dz*dt;pts.push([x,y,z,t]);if(pts.length>max)pts.shift();t+=.002}}function raw(p,a){const ca=Math.cos(a),sa=Math.sin(a),px=p[0]*ca-p[2]*sa,pz=p[0]*sa+p[2]*ca,py=p[1]-25;return[px,py,pz]}function frame(a){let minX=1e9,maxX=-1e9,minY=1e9,maxY=-1e9,raws=[];for(const p of pts){const r=raw(p,a);raws.push(r);minX=Math.min(minX,r[0]);maxX=Math.max(maxX,r[0]);minY=Math.min(minY,r[1]);maxY=Math.max(maxY,r[1])}const bw=maxX-minX||1,bh=maxY-minY||1,fit=Math.min(w*.82/bw,h*.66/bh),cx=(minX+maxX)/2,cy=(minY+maxY)/2;return{raws,fit,cx,cy}}function project(r,f){const depth=1+70/(120+r[2]);return[w*.5+(r[0]-f.cx)*f.fit*depth,h*.5-(r[1]-f.cy)*f.fit*depth]}function draw(){step();const a=performance.now()*.00012,f=frame(a);ctx.fillStyle='rgba(2,6,23,.18)';ctx.fillRect(0,0,w,h);ctx.lineWidth=Math.max(1.05,Math.min(w,h)*.003);ctx.lineCap='round';ctx.lineJoin='round';for(let i=1;i<f.raws.length;i++){const p0=project(f.raws[i-1],f),p1=project(f.raws[i],f),q=i/f.raws.length,hue=(pts[i][3]*95+i*.11)%360;ctx.strokeStyle=`hsla(${hue},95%,${52+q*26}%,${.04+q*.9})`;ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke()}requestAnimationFrame(draw)}draw()})();</script></body></html>
